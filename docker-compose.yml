services:
  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      selenium:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  bot:
    build:
      context: .
      dockerfile: bot.Dockerfile
    env_file: .env
    depends_on:
      - api
    volumes:
      - ./src:/app/src

  selenium:
    image: selenium/standalone-chrome:latest
    ports:
      - "4444:4444"
    shm_size: "2g"

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U movies -d movies_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  celery-worker:
    build:
      context: .
      dockerfile: api.Dockerfile
    env_file: .env
    command: celery -A src.app.tasks.celery_app:celery_app worker --loglevel=info --concurrency=2
    depends_on:
      redis:
          condition: service_healthy
      postgres:
          condition: service_healthy
      selenium:
          condition: service_started
    volumes:
      - ./src:/app/src

  celery-beat:
    build:
      context: .
      dockerfile: api.Dockerfile
    env_file: .env
    command: celery -A src.app.tasks.celery_app:celery_app beat --loglevel=info
    depends_on:
      redis:
          condition: service_healthy
    volumes:
      - ./src:/app/src

volumes:
    postgres_data:
    redis_data:
