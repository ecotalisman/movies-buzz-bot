services:
  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src

  bot:
    build:
      context: .
      dockerfile: bot.Dockerfile
    env_file: .env
    depends_on:
      - api
    volumes:
      - ./src:/app/src
